<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobAgent0</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
        <div class="popup-container">
                <!-- Shader background (Three.js) -->
                <div id="shader" aria-hidden="true"></div>
                <script id="vertex" type="x-shader/x-vertex">
    varying vec2 vUv;
        void main() { gl_Position = vec4(position, 1.0);
                             vUv = uv;
                            }
</script>

<script id="fragment" type="x-shader/x-fragment">
precision highp float;

uniform vec2 u_resolution;
uniform float u_time;
    varying vec2 vUv;
 
const float PI = 3.1415926535897932384626433832795;
const float TAU = PI * 2.;
 

void coswarp(inout vec3 trip, float warpsScale ){

    trip.xyz += warpsScale * .1 * cos(3. * trip.yzx + (u_time * .25));
    trip.xyz += warpsScale * .05 * cos(11. * trip.yzx + (u_time * .25));
    trip.xyz += warpsScale * .025 * cos(17. * trip.yzx + (u_time * .25));
  
}



  
void main() {
        vec2 uv = (gl_FragCoord.xy - u_resolution * .5) / u_resolution.yy + 0.5;
  
    float t = (u_time *.2) + length(fract((uv-.5) *10.));
  
     float t2 = (u_time *.1) + length(fract((uv-.5) *20.));
 
  
  
    vec2 uv2 = uv;
     vec2 uv3 = uv;
    
    vec3 w = vec3(uv.x, uv.y, 1.);
    coswarp(w, 3.);
  
    uv.x+= w.r;
    uv.y+= w.g;
    
 
    vec3 color = vec3(0., .5, uv2.x);
  
    color.r = sin(u_time *.2) + sin(length(uv-.5) * 10.);
  
     color.g = sin(u_time *.3) + sin(length(uv-.5) * 20.);
  
    coswarp(color, 3.);
  
  
    color = vec3(smoothstep(color.r, sin(t2), sin(t)));
    color = clamp(color, 0.0, 1.0);

    // Keep shader in a dark palette with subtle blue accents
    vec3 base = vec3(0.02, 0.03, 0.05);
    vec3 accent = vec3(0.10, 0.18, 0.32);
    vec3 finalColor = mix(base, accent, color);
    
        gl_FragColor = vec4(finalColor, 1.0);
}
</script>
        <!-- Backend status pill (glassmorphism) -->
        <div id="backendPill" class="backend-pill checking">Checking...</div>
        <div class="popup-header">
            <div class="popup-title">JobAgent0</div>
            <div class="popup-description">AI-powered resume and cover letter generation</div>
        </div>

        <!-- Resume Upload Section -->
        <div id="uploadSection" class="section">
            <input
                type="file"
                id="resumeInput"
                accept=".pdf"
                style="display: none;"
            >
            <div id="dropZone" class="drop-zone">
                <svg class="upload-icon" width="48" height="48" viewBox="0 0 24 24" fill="none">
                    <path d="M7 18a4.6 4.4 0 0 1 0-9 5 4.5 0 0 1 11 2h1a3.5 3.5 0 0 1 0 7h-12Z"
                          stroke="currentColor" stroke-width="2"/>
                    <path d="M9 15l3-3 3 3M12 12v9" stroke="currentColor" stroke-width="2"/>
                </svg>
                <div class="drop-zone-text">
                    <strong>Drop PDF here</strong> or <span class="link-text">browse files</span>
                </div>
                <div class="drop-zone-hint">PDF files up to 10MB</div>
            </div>
            <div id="uploadStatus" class="status-message"></div>
        </div>

        <!-- Success Section (hidden initially) -->
        <div id="successSection" class="section hidden">
            <div class="success-icon">✓</div>
            <div class="button-group row">
                <button class="primary-button" id="generateResumeBtn">
                    Generate Resume
                </button>
                <button class="primary-button" id="generateCoverBtn">
                    Generate Cover Letter
                </button>
            </div>
            <div class="button-group">
                <button class="secondary-button" id="reuploadBtn">
                    Upload Different Resume
                </button>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="loading hidden">
            <div class="spinner"></div>
            <div class="loading-content">
                <p id="loadingText" class="loading-message">Processing...</p>
                <p id="loadingProgress" class="loading-progress">Step 1 of 3</p>
                <p id="loadingDetail" class="loading-detail">Extracting text from PDF...</p>
            </div>
        </div>

        <div class="popup-footer">
            <div id="backendStatus" class="backend-status checking">
                <span class="status-dot"></span> Checking backend...
            </div>
            <div class="keyboard-hints">
                <div class="hint"><kbd>Ctrl+U</kbd> Upload</div>
                <div class="hint"><kbd>Ctrl+G</kbd> Generate</div>
                <div class="hint"><kbd>Esc</kbd> Clear</div>
            </div>
        </div>
        <div class="applied-counter">
            <div class="applied-counter-line">
                $: <span id="appliedCounter" class="success-message">.success-message</span>
            </div>
        </div>
    </div>

    <script src="three.min.js"></script>
    <script src="background-shader.js"></script>
    <script src="popup.js"></script>
</body>
</html>
